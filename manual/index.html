<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon SP-API 接続キー取得マニュアル</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="slide-viewer">
      <!-- スライド画像表示エリア -->
      <div class="slide-container">
        <img id="slide-image" src="" alt="スライドマニュアル">
        
        <!-- 左右のナビゲーション矢印 -->
        <button id="btn-prev" class="nav-arrow prev-arrow" aria-label="前へ">◀</button>
        <button id="btn-next" class="nav-arrow next-arrow" aria-label="次へ">▶</button>
      </div>

      <!-- 下部コントロールバー（スライドカウンター） -->
      <div class="control-bar">
        <span id="slide-counter">1 / 14</span>
      </div>
    </div>
  </div>

  <script>
    // 14枚のスライド定義（画像のみの軽量データ）
    const slides = [
      { id: 1, image: "output/slide_01.png" },
      { id: 2, image: "output/slide_02.png" },
      { id: 3, image: "output/slide_03.png" },
      { id: 4, image: "output/slide_04.png" },
      { id: 5, image: "output/slide_05.png" },
      { id: 6, image: "output/slide_06.png" },
      { id: 7, image: "output/slide_07.png" },
      { id: 8, image: "output/slide_08.png" },
      { id: 9, image: "output/slide_09.png" },
      { id: 10, image: "output/slide_10.png" },
      { id: 11, image: "output/slide_11.png" },
      { id: 12, image: "output/slide_12.png" },
      { id: 13, image: "output/slide_13.png" },
      { id: 14, image: "output/slide_14.png" }
    ];

    let currentSlideIndex = 0;

    // DOM要素の取得
    const slideImage = document.getElementById("slide-image");
    const slideCounter = document.getElementById("slide-counter");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    // スライド切り替え表示関数
    function renderSlide(index) {
      const slide = slides[index];
      slideImage.src = slide.image;
      
      // カウンター更新
      slideCounter.textContent = `${index + 1} / ${slides.length}`;
      
      // ボタン有効/無効状態（最初のスライドでは「前へ」を隠す/無効にし、最後のスライドでは「次へ」を隠す/無効にする）
      btnPrev.style.visibility = index === 0 ? "hidden" : "visible";
      btnNext.style.visibility = index === slides.length - 1 ? "hidden" : "visible";
    }

    // ナビゲーションイベント
    btnPrev.addEventListener("click", () => {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    });

    btnNext.addEventListener("click", () => {
      if (currentSlideIndex < slides.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    });

    // キーボード操作のサポート
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "Left") {
        if (currentSlideIndex > 0) btnPrev.click();
      } else if (e.key === "ArrowRight" || e.key === "Right") {
        if (currentSlideIndex < slides.length - 1) btnNext.click();
      }
    });

    // URLパラメータからスライド番号 (1-indexed) を取得して初期表示スライドを決定
    const urlParams = new URLSearchParams(window.location.search);
    const slideParam = urlParams.get('slide');
    if (slideParam) {
      const slideNum = parseInt(slideParam, 10);
      if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= slides.length) {
        currentSlideIndex = slideNum - 1;
      }
    }
    // 初期化
    renderSlide(currentSlideIndex);
  </script>
</body>
</html>
