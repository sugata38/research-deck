        image: "../screenshot/CleanShot 2026-06-25 at 19.53.28@2x.png",
        overlays: [
          // 入力キーすべてのマスク
          { type: "mask-text", top: "49.5%", left: "37.5%", width: "45.0%", height: "3.0%", text: "amzn1.application-oa2-client.xxxxxxxxxxxxxxxxxxxxxxxxxxxx" },
          { type: "mask-text", top: "57.4%", left: "37.5%", width: "45.0%", height: "3.0%", text: "amzn1.oa2-cs.v1.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" },

    let currentSlideIndex = 0;

    // DOM要素の取得
    const slideCounter = document.getElementById("slide-counter");
    const slideBadge = document.getElementById("slide-badge");
    const slideTitle = document.getElementById("slide-title");
    const slideDescription = document.getElementById("slide-description");
    const slideImage = document.getElementById("slide-image");
    const overlayLayer = document.getElementById("overlay-layer");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const chkDebug = document.getElementById("chk-debug");
    const debugOutput = document.getElementById("debug-output");
    const imageWorkspace = document.getElementById("image-workspace");
    const dragPreview = document.getElementById("drag-preview");

    // スライド切り替え表示関数
    function renderSlide(index) {
      const slide = slides[index];
      
      // テキスト・画像の設定
      slideBadge.textContent = slide.badge;
      slideTitle.innerHTML = slide.title.replace(/\n/g, "<br>");
      slideDescription.innerHTML = slide.description;
      slideImage.src = slide.image;
      
      // カウンター更新
      slideCounter.textContent = `${index + 1} / ${slides.length}`;
      
      // ボタン有効状態
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === slides.length - 1;
      
      // オーバーレイのクリアと再生成
      overlayLayer.innerHTML = "";
      
      // 画像ロード後にオーバーレイを設定
      slideImage.onload = () => {
        if (slide.overlays) {
          slide.overlays.forEach(overlay => {
            const el = document.createElement("div");
            el.className = `overlay-item ${overlay.type}`;
            el.style.top = overlay.top;
            el.style.left = overlay.left;
            el.style.width = overlay.width;
            el.style.height = overlay.height;
            
            if (overlay.text) {
              el.textContent = overlay.text;
            }
            
            overlayLayer.appendChild(el);
          });
        }
      };
      
      // すでに画像がキャッシュされている場合の対策
      if (slideImage.complete) {
        slideImage.onload();
      }
    }

    // ナビゲーションイベント
    btnPrev.addEventListener("click", () => {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    });

    btnNext.addEventListener("click", () => {
      if (currentSlideIndex < slides.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    });

    // キーボード操作のサポート
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "Left") {
        btnPrev.click();
      } else if (e.key === "ArrowRight" || e.key === "Right") {
        btnNext.click();
      }
    });

    // --- 座標デバッグモード (ドラッグして％座標を取得するツール) ---
    let isDragging = false;
    let startX = 0, startY = 0;

    imageWorkspace.addEventListener("mousedown", (e) => {
      if (!chkDebug.checked) return;
      
      // 画像の実際のバウンディングボックスを取得
      const rect = slideImage.getBoundingClientRect();
      
      // クリック位置が画像範囲内かチェック
      if (e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom) {
        
        isDragging = true;
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        
        dragPreview.style.display = "block";
        dragPreview.style.left = `${(startX / rect.width) * 100}%`;
        dragPreview.style.top = `${(startY / rect.height) * 100}%`;
        dragPreview.style.width = "0%";
        dragPreview.style.height = "0%";
        
        e.preventDefault();
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      
      const rect = slideImage.getBoundingClientRect();
      const currentX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const currentY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      const width = Math.abs(startX - currentX);
      const height = Math.abs(startY - currentY);
      
      dragPreview.style.left = `${(left / rect.width) * 100}%`;
      dragPreview.style.top = `${(top / rect.height) * 100}%`;
      dragPreview.style.width = `${(width / rect.width) * 100}%`;
      dragPreview.style.height = `${(height / rect.height) * 100}%`;
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      
      const rect = slideImage.getBoundingClientRect();
      const currentX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const currentY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      
      const leftPct = ((Math.min(startX, currentX) / rect.width) * 100).toFixed(1);
      const topPct = ((Math.min(startY, currentY) / rect.height) * 100).toFixed(1);
      const widthPct = ((Math.abs(startX - currentX) / rect.width) * 100).toFixed(1);
      const heightPct = ((Math.abs(startY - currentY) / rect.height) * 100).toFixed(1);
      
      dragPreview.style.display = "none";
      
      // 座標情報の出力
      const coordStr = `{ type: "rect-red", top: "${topPct}%", left: "${leftPct}%", width: "${widthPct}%", height: "${heightPct}%" }`;
      debugOutput.innerHTML = `座標コード (クリックしてコピー):<br><textarea onclick="this.select(); document.execCommand('copy')" style="width:100%; height:45px; font-size:11px; margin-top:5px; background:#222; color:#fff; border:1px solid #444; border-radius:3px; padding:3px; box-sizing:border-box; resize:none;">${coordStr}</textarea>`;
    });

    // URLパラメータからスライド番号 (1-indexed) を取得して初期表示スライドを決定
    const urlParams = new URLSearchParams(window.location.search);
    const slideParam = urlParams.get('slide');
    if (slideParam) {
      const slideNum = parseInt(slideParam, 10);
      if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= slides.length) {
        currentSlideIndex = slideNum - 1;
      }
    }
    // 初期化
    renderSlide(currentSlideIndex);
  </script>
</body>
</html>
